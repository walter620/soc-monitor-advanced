version: '3.8'

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: soc-monitor-advanced-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://soc_user:soc_pass123@db:5432/soc_monitor
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    restart: unless-stopped
    networks:
      - soc-network

  web:
    image: python:3.11-slim
    container_name: soc-monitor-advanced-web
    working_dir: /app
    volumes:
      - ./web:/app
    ports:
      - "3000:9090"
    command: python3 -m http.server 9090 --directory /app
    restart: unless-stopped
    networks:
      - soc-network

  db:
    image: postgres:15
    container_name: soc-monitor-advanced-db
    environment:
      POSTGRES_USER: soc_user
      POSTGRES_PASSWORD: soc_pass123
      POSTGRES_DB: soc_monitor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - soc-network

  redis:
    image: redis:7-alpine
    container_name: soc-monitor-advanced-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - soc-network

networks:
  soc-network:
    driver: bridge

volumes:
  postgres_data:
