version: '3.8'

services:
  # API principal
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=SOC Monitor Advanced
      - APP_VERSION=2.0.0
      - DEBUG=false
      - SECRET_KEY=your-super-secret-key-change-in-production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - DATABASE_URL=postgresql://soc_user:soc_password@db:5432/soc_monitor
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_SIGNING_SECRET=${SLACK_SIGNING_SECRET}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
    networks:
      - soc-network
    restart: unless-stopped

  # Base de datos PostgreSQL
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=soc_user
      - POSTGRES_PASSWORD=soc_password
      - POSTGRES_DB=soc_monitor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc_user -d soc_monitor"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - soc-network
    restart: unless-stopped

  # Redis para caching y sessions
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - soc-network
    restart: unless-stopped

  # Redis Commander para gestión de Redis (opcional)
  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - soc-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  soc-network:
    driver: bridge
