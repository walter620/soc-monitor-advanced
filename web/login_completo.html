<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOC Monitor - Login Completo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(148, 163, 184, 0.2);
      max-width: 500px;
      width: 100%;
    }
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    .header h1 { color: #06b6d4; margin-bottom: 10px; }
    .header p { color: #9ca3af; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; color: #9ca3af; margin-bottom: 8px; font-weight: 500; }
    .form-group input {
      width: 100%;
      padding: 14px 18px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 10px;
      color: #f9fafb;
      font-size: 1rem;
    }
    .form-group input:focus { outline: none; border-color: #06b6d4; }
    .btn {
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: 600;
      margin-top: 10px;
      transition: all 0.3s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #06b6d4, #0891b2);
      color: white;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(6, 182, 212, 0.4); }
    .btn-secondary {
      background: rgba(148, 163, 184, 0.1);
      color: #f9fafb;
      border: 1px solid rgba(148, 163, 184, 0.3);
    }
    .btn-secondary:hover { background: rgba(148, 163, 184, 0.2); }
    .message {
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }
    .message.show { display: block; }
    .message.error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
    }
    .message.success {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #10b981;
    }
    .info-section {
      margin-top: 30px;
      padding: 20px;
      background: rgba(15, 23, 42, 0.5);
      border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.1);
    }
    .info-section h3 { color: #f9fafb; margin-bottom: 10px; font-size: 1rem; }
    .user-list { margin: 10px 0; }
    .user-item {
      padding: 8px;
      margin: 5px 0;
      background: rgba(55, 65, 81, 0.5);
      border-radius: 6px;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
    }
    .user-item .username { color: #06b6d4; font-weight: 600; }
    .user-item .status { color: #10b981; }
    .debug-panel {
      margin-top: 20px;
      padding: 15px;
      background: #1f2937;
      border-radius: 8px;
      max-height: 200px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.8rem;
    }
    .debug-panel .entry { margin: 3px 0; }
    .debug-panel .entry.error { color: #ef4444; }
    .debug-panel .entry.success { color: #10b981; }
    .debug-panel .entry.info { color: #06b6d4; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🛡️ SOC Monitor</h1>
      <p>Sistema de Monitoreo de Seguridad</p>
    </div>

    <div id="successMessage" class="message success"></div>
    <div id="errorMessage" class="message error"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="username">Nombre de Usuario</label>
        <input type="text" id="username" name="username" placeholder="Ej: admin" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn btn-primary" id="loginBtn">🔐 Acceder</button>
    </form>

    <div class="info-section">
      <h3>📋 Usuarios Disponibles</h3>
      <div id="userList" class="user-list">Cargando...</div>
      <button class="btn btn-secondary" onclick="refreshUserList()" style="margin-top: 10px; width: auto;">🔄 Actualizar</button>
    </div>

    <div class="info-section">
      <h3>🔍 Diagnóstico</h3>
      <button class="btn btn-secondary" onclick="runDiagnostic()" style="width: auto; margin-bottom: 10px;">▶️ Ejecutar Diagnóstico</button>
      <button class="btn btn-primary" onclick="createTestUser()" style="width: auto; margin-bottom: 10px;">✅ Crear Usuario Test</button>
      <div id="debugOutput" class="debug-panel">Click en "Ejecutar Diagnóstico" para ver...</div>
    </div>
  </div>

  <script>
    const USERS_KEY = 'soc_monitor_api_users';
    const AUTH_CONFIG = {
      TOKEN: 'soc_auth_token',
      USER: 'soc_user',
      ROLE: 'soc_user_role',
      LAST_LOGIN: 'soc_last_login'
    };

    // Cargar usuarios al iniciar
    window.addEventListener('DOMContentLoaded', () => {
      refreshUserList();
    });

    function refreshUserList() {
      const userListDiv = document.getElementById('userList');
      const usersData = localStorage.getItem(USERS_KEY);
      
      if (!usersData) {
        userListDiv.innerHTML = '<div style="color: #ef4444;">No hay usuarios registrados</div>';
        return;
      }
      
      try {
        const users = JSON.parse(usersData);
        
        if (users.length === 0) {
          userListDiv.innerHTML = '<div style="color: #f59e0b;">Array de usuarios vacío</div>';
          return;
        }
        
        userListDiv.innerHTML = users.map(u => {
          const hasPass = u.password && u.password.trim() !== '';
          return `<div class="user-item">
            <span class="username">${u.username}</span>
            <span class="status">${hasPass ? '✅' : '❌'} ${u.role}</span>
          </div>`;
        }).join('');
      } catch (e) {
        userListDiv.innerHTML = '<div style="color: #ef4444;">Error: ' + e.message + '</div>';
      }
    }

    function handleLogin(event) {
      event.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      
      const errorMessage = document.getElementById('errorMessage');
      const successMessage = document.getElementById('successMessage');
      const loginBtn = document.getElementById('loginBtn');
      const debugOutput = document.getElementById('debugOutput');
      
      // Limpiar mensajes anteriores
      errorMessage.classList.remove('show');
      successMessage.classList.remove('show');
      addDebug('info', '🔐 Iniciando login: ' + username);
      
      // Limpiar campos
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
      
      // Mostrar estado de carga
      loginBtn.disabled = true;
      loginBtn.innerHTML = '⏳ Autenticando...';
      
      setTimeout(() => {
        try {
          addDebug('info', '📦 Obteniendo datos de localStorage...');
          
          // Obtener usuarios desde localStorage
          const usersData = localStorage.getItem(USERS_KEY);
          addDebug('info', '📁 usersData: ' + (usersData ? 'existen datos' : 'NINGUNO'));
          
          if (!usersData) {
            addDebug('error', '❌ NO HAY USUARIOS EN LOCALSTORAGE');
            showMessage('❌ No hay usuarios registrados. Click en "Crear Usuario Test"', 'error');
            loginBtn.disabled = false;
            loginBtn.innerHTML = '🔐 Acceder';
            return;
          }
          
          const users = JSON.parse(usersData);
          addDebug('info', '📊 Total de usuarios: ' + users.length);
          addDebug('info', '👥 Usuarios: ' + users.map(u => u.username).join(', '));
          addDebug('info', '🔍 Buscando: ' + username);
          
          // Buscar usuario por username (case-INSENSITIVE)
          const user = users.find(u => u.username.toLowerCase() === username.toLowerCase());
          addDebug('info', '🎯 Usuario encontrado: ' + (user ? 'SÍ' : 'NO'));
          
          if (!user) {
            addDebug('error', '❌ Usuario no encontrado: ' + username);
            addDebug('error', '📋 Usuarios disponibles: ' + users.map(u => u.username).join(', '));
            showMessage('❌ Usuario no encontrado: "' + username + '"\n\nUsuarios disponibles: ' + users.map(u => u.username).join(', '), 'error');
            loginBtn.disabled = false;
            loginBtn.innerHTML = '🔐 Acceder';
            return;
          }
          
          addDebug('info', '✅ Usuario encontrado: ' + user.username);
          addDebug('info', '🔑 Password en usuario: ' + (user.password ? 'EXISTE' : 'VACÍO'));
          addDebug('info', '🔑 Password ingresado: ' + (password ? 'EXISTE' : 'VACÍO'));
          
          // Verificar contraseña
          if (!user.password || user.password.trim() === '') {
            addDebug('error', '❌ Usuario no tiene contraseña');
            showMessage('❌ El usuario "' + user.username + '" no tiene contraseña configurada.', 'error');
            loginBtn.disabled = false;
            loginBtn.innerHTML = '🔐 Acceder';
            return;
          }
          
          if (user.password !== password) {
            addDebug('error', '❌ Contraseña incorrecta');
            addDebug('error', '   Sistema: "' + user.password + '"');
            addDebug('error', '   Ingresada: "' + password + '"');
            showMessage('❌ Contraseña incorrecta\n\nSistema: "' + user.password + '"\nIngresada: "' + password + '"', 'error');
            loginBtn.disabled = false;
            loginBtn.innerHTML = '🔐 Acceder';
            return;
          }
          
          // Login exitoso
          addDebug('success', '✅ Credenciales válidas!');
          addDebug('info', '🔐 Creando sesión...');
          
          localStorage.setItem(AUTH_CONFIG.TOKEN, 'valid_token_' + Date.now());
          localStorage.setItem(AUTH_CONFIG.USER, user.username);
          localStorage.setItem(AUTH_CONFIG.ROLE, user.role || 'operator');
          localStorage.setItem(AUTH_CONFIG.LAST_LOGIN, new Date().toISOString());
          
          addDebug('success', '✅ Sesión creada');
          addDebug('info', '🚪 Redirigiendo...');
          
          showMessage('✅ ¡Bienvenido, ' + (user.full_name || user.username) + '!', 'success');
          
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 1000);
          
        } catch (error) {
          addDebug('error', '❌ Error: ' + error.message);
          addDebug('error', error.stack);
          showMessage('❌ Error al autenticar: ' + error.message, 'error');
          loginBtn.disabled = false;
          loginBtn.innerHTML = '🔐 Acceder';
        }
      }, 500);
    }

    function runDiagnostic() {
      const debugOutput = document.getElementById('debugOutput');
      debugOutput.innerHTML = '';
      
      addDebug('info', '='.repeat(50));
      addDebug('info', '🔬 DIAGNÓSTICO - SOC Monitor');
      addDebug('info', '='.repeat(50));
      
      // 1. Listar claves
      addDebug('info', '\n1️⃣  Claves en localStorage:');
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        const value = localStorage.getItem(key);
        addDebug('info', '   ' + key + ': ' + (value.length > 100 ? value.substring(0, 100) + '...' : value));
      }
      
      // 2. Verificar usuarios
      const usersData = localStorage.getItem(USERS_KEY);
      if (!usersData) {
        addDebug('error', '\n❌ No hay usuarios en localStorage');
      } else {
        try {
          const users = JSON.parse(usersData);
          addDebug('success', '\n✅ ' + users.length + ' usuario(s) en localStorage');
          
          users.forEach(u => {
            addDebug('info', '\n👤 ' + u.username);
            addDebug('info', '   ID: ' + u.id);
            addDebug('info', '   Password: ' + (u.password ? '"' + u.password + '"' : '(vacío)'));
            addDebug('info', '   Role: ' + u.role);
          });
        } catch (e) {
          addDebug('error', '❌ Error al parsear: ' + e.message);
        }
      }
      
      addDebug('success', '\n' + '='.repeat(50));
      addDebug('success', '✅ Diagnóstico completado');
      addDebug('success', '='.repeat(50));
    }

    function createTestUser() {
      if (!confirm('⚠️ ¿Crear usuario "alejo" con contraseña?\n\nSi ya existe, se actualizará.')) return;
      
      const usersData = localStorage.getItem(USERS_KEY);
      let users = usersData ? JSON.parse(usersData) : [];
      
      // Buscar si ya existe
      const existingIndex = users.findIndex(u => u.username.toLowerCase() === 'alejo');
      
      if (existingIndex >= 0) {
        users[existingIndex] = {
          ...users[existingIndex],
          password: 'alejo123',
          full_name: 'Alejo Usuario',
          email: 'alejo@empresa.com',
          role: 'operator',
          is_active: true,
          updated_at: new Date().toISOString()
        };
        addDebug('info', '🔄 Usuario "alejo" actualizado');
      } else {
        const newId = users.length > 0 ? Math.max(...users.map(u => u.id)) + 1 : 1;
        users.push({
          id: newId,
          username: 'alejo',
          full_name: 'Alejo Usuario',
          email: 'alejo@empresa.com',
          password: 'alejo123',
          role: 'operator',
          is_active: true,
          created_at: new Date().toISOString()
        });
        addDebug('success', '✅ Usuario "alejo" creado');
      }
      
      localStorage.setItem(USERS_KEY, JSON.stringify(users));
      
      addDebug('success', '✅ Usuario creado/actualizado en localStorage');
      showMessage('✅ Usuario "alejo" con contraseña "alejo123" creado/actualizado', 'success');
      refreshUserList();
      
      // Auto-login
      setTimeout(() => {
        document.getElementById('username').value = 'alejo';
        document.getElementById('password').value = 'alejo123';
        addDebug('info', '🎯 Preparando login automático...');
      }, 500);
    }

    function addDebug(level, message) {
      const debugOutput = document.getElementById('debugOutput');
      const entry = document.createElement('div');
      entry.className = 'entry ' + level;
      entry.textContent = '[' + new Date().toLocaleTimeString() + '] ' + message;
      debugOutput.appendChild(entry);
      debugOutput.scrollTop = debugOutput.scrollHeight;
    }

    function showMessage(text, type) {
      const el = document.getElementById(type + 'Message');
      if (el) {
        el.textContent = text.replace(/\\n/g, '\n');
        el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 5000);
      }
    }
  </script>
</body>
</html>
