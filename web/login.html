<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOC Monitor v3.0 - Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(148, 163, 184, 0.2);
      max-width: 420px;
      width: 100%;
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-header .icon {
      font-size: 3rem;
      margin-bottom: 15px;
    }

    .login-header h1 {
      color: #f9fafb;
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .login-header p {
      color: #9ca3af;
      font-size: 1rem;
    }

    .version-badge {
      display: inline-block;
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      color: white;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 15px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      color: #9ca3af;
      font-weight: 500;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    .form-group input {
      width: 100%;
      padding: 14px 18px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 10px;
      color: #f9fafb;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: #06b6d4;
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.1);
    }

    .form-group input::placeholder {
      color: #6b7280;
    }

    .login-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #06b6d4, #0891b2);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(6, 182, 212, 0.4);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      display: none;
    }

    .error-message.show {
      display: block;
      animation: slideIn 0.3s ease;
    }

    .success-message {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #10b981;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      display: none;
    }

    .success-message.show {
      display: block;
      animation: slideIn 0.3s ease;
    }

    .info-text {
      text-align: center;
      margin-top: 25px;
      color: #6b7280;
      font-size: 0.85rem;
    }

    .info-text a {
      color: #06b6d4;
      text-decoration: none;
    }

    .info-text a:hover {
      text-decoration: underline;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .pulse-icon {
      animation: pulse 2s infinite;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <div class="icon pulse-icon">🛡️</div>
      <h1>SOC Monitor</h1>
      <p>Sistema de Monitoreo de Seguridad</p>
      <span class="version-badge">v3.0.0</span>
    </div>

    <div id="errorMessage" class="error-message"></div>
    <div id="successMessage" class="success-message"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="username">Nombre de Usuario</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          placeholder="Ej: admin"
          autocomplete="username"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          placeholder="••••••••"
          autocomplete="current-password"
          required
        />
      </div>

      <button type="submit" class="login-btn">
        🔐 Acceder
      </button>
    </form>

    <div class="info-text">
      <p>Usuario por defecto: <strong>admin</strong> | Contraseña: <strong>admin123</strong></p>
      <p style="margin-top: 8px;">¿Olvidaste tu contraseña? Contacta al administrador</p>
    </div>
  </div>

  <script>
    // Configurar sistema
    const AUTH_CONFIG = {
      STORAGE_KEYS: {
        TOKEN: 'soc_auth_token',
        USER: 'soc_user',
        ROLE: 'soc_user_role',
        LAST_LOGIN: 'soc_last_login'
      }
    };

    // Verificar si ya hay sesión
    window.addEventListener('DOMContentLoaded', function() {
      const token = localStorage.getItem(AUTH_CONFIG.STORAGE_KEYS.TOKEN);
      if (token) {
        // Ya hay sesión, redirigir al dashboard
        window.location.href = 'dashboard.html';
      }
    });

    // Manejar login
    function handleLogin(event) {
      event.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      
      const errorMessage = document.getElementById('errorMessage');
      const successMessage = document.getElementById('successMessage');
      const loginBtn = event.target.querySelector('.login-btn');
      
      // Limpiar mensajes anteriores
      errorMessage.classList.remove('show');
      successMessage.classList.remove('show');
      
      // Validar campos vacíos
      if (!username || !password) {
        showError('Por favor ingresa usuario y contraseña');
        return;
      }

      // Mostrar estado de carga
      loginBtn.disabled = true;
      loginBtn.innerHTML = '⏳ Autenticando...';

      // Simular autenticación
      setTimeout(() => {
        try {
          // Obtener usuarios desde localStorage
          const usersData = localStorage.getItem('soc_monitor_api_users');
          
          // DEBUG: Mostrar qué hay en localStorage
          console.log('[DEBUG] usersData:', usersData);
          console.log('[DEBUG] localStorage keys:', Object.keys(localStorage));
          
          const users = usersData ? JSON.parse(usersData) : [];
          console.log('[DEBUG] users array:', users);
          console.log('[DEBUG] buscando usuario:', username);
          
          // Buscar usuario por username - mostrar TODOS los usernames disponibles
          const allUsernames = users.map(u => u.username);
          console.log('[DEBUG] todos los usernames:', allUsernames);
          
          // Buscar usuario por username (case-INSENSITIVE exact match)
          const user = users.find(u => u.username.toLowerCase() === username.toLowerCase());
          console.log('[DEBUG] user encontrado:', user);
          
          if (!user) {
            // Mostrar error con lista de usuarios disponibles
            const userList = users.length > 0 ? users.map(u => u.username).join(', ') : 'NINGUNO';
            showError(`❌ Usuario no encontrado: "${username}"\n\nUsuarios disponibles: ${userList || 'NINGUNO'}`);
            loginBtn.disabled = false;
            loginBtn.innerHTML = '🔐 Acceder';
            return;
          }
          
          console.log('[DEBUG] Usuario encontrado - Verificando contraseña');
          console.log('[DEBUG] password en usuario:', user.password ? '(existe)' : '(vacío)');
          console.log('[DEBUG] password ingresado:', password ? '(existe)' : '(vacío)');
          console.log('[DEBUG] Comparación - usuario.password:', user.password);
          console.log('[DEBUG] Comparación - password:', password);
          
          // Verificar contraseña (case-sensitive exact match)
          if (!user.password || user.password.trim() === '') {
            showError('❌ El usuario no tiene contraseña configurada. Pide al administrador que le ponga una contraseña.');
            loginBtn.disabled = false;
            loginBtn.innerHTML = '🔐 Acceder';
            return;
          }
          
          if (user.password !== password) {
            showError(`❌ Contraseña incorrecta\n\nPassword en sistema: "${user.password}"\nPassword ingresado: "${password}"`);
            loginBtn.disabled = false;
            loginBtn.innerHTML = '🔐 Acceder';
            return;
          }
          
          console.log('[DEBUG] Credenciales válidas - Creando sesión');
          
          // Crear sesión
          const sessionData = {
            username: username,
            role: user.role || 'operator',
            loginTime: new Date().toISOString()
          };
          
          localStorage.setItem(AUTH_CONFIG.STORAGE_KEYS.TOKEN, 'valid_token_' + Date.now());
          localStorage.setItem(AUTH_CONFIG.STORAGE_KEYS.USER, username);
          localStorage.setItem(AUTH_CONFIG.STORAGE_KEYS.ROLE, user.role || 'operator');
          localStorage.setItem(AUTH_CONFIG.STORAGE_KEYS.LAST_LOGIN, new Date().toISOString());
          
          console.log('[DEBUG] Sesión creada');
          console.log('[DEBUG] Token:', localStorage.getItem(AUTH_CONFIG.STORAGE_KEYS.TOKEN));
          console.log('[DEBUG] Usuario:', localStorage.getItem(AUTH_CONFIG.STORAGE_KEYS.USER));
          console.log('[DEBUG] Role:', localStorage.getItem(AUTH_CONFIG.STORAGE_KEYS.ROLE));
          
          showSuccess(`✅ ¡Bienvenido, ${user.full_name || username}!`);
          
          // Redirigir al dashboard
          setTimeout(() => {
            console.log('[DEBUG] Redirigiendo a dashboard.html');
            window.location.href = 'dashboard.html';
          }, 800);

        } catch (error) {
          console.error('[DEBUG] Error completo:', error);
          showError('❌ Error al autenticar: ' + error.message);
          loginBtn.disabled = false;
          loginBtn.innerHTML = '🔐 Acceder';
        }
      }, 500);
    }

    // Mostrar error
    function showError(message) {
      const errorMessage = document.getElementById('errorMessage');
      errorMessage.textContent = message;
      errorMessage.classList.add('show');
      
      // Auto-ocultar después de 5 segundos
      setTimeout(() => {
        errorMessage.classList.remove('show');
      }, 5000);
    }

    // Mostrar éxito
    function showSuccess(message) {
      const successMessage = document.getElementById('successMessage');
      successMessage.textContent = message;
      successMessage.classList.add('show');
    }

    // Permitir login con Enter
    document.getElementById('password').addEventListener('keypress', function(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        document.getElementById('loginForm').requestSubmit();
      }
    });
  </script>
</body>
</html>
