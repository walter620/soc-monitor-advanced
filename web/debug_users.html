<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diagnóstico Usuarios - SOC Monitor</title>
  <style>
    body {
      font-family: monospace;
      padding: 20px;
      background: #0f172a;
      color: #f9fafb;
      max-width: 1000px;
      margin: 0 auto;
    }
    .success { color: #10b981; }
    .error { color: #ef4444; }
    .warning { color: #f59e0b; }
    .info { color: #06b6d4; }
    .section {
      background: #1e293b;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      border: 1px solid #374151;
    }
    pre {
      background: #111827;
      padding: 10px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 12px;
    }
    button {
      background: linear-gradient(135deg, #06b6d4, #8b5cf6);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      margin: 5px 5px 5px 0;
      font-weight: 600;
      font-size: 13px;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
    }
    h1 { color: #06b6d4; }
    h2 { color: #8b5cf6; font-size: 16px; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>🔍 Diagnóstico Usuarios - SOC Monitor</h1>

  <div class="section">
    <h2>1. Estado del Sistema</h2>
    <button onclick="checkSystem()">🔍 Verificar Sistema</button>
    <button onclick="clearUsers()">🗑️ Limpiar localStorage</button>
    <button onclick="loadInitialData()">📋 Cargar Datos Iniciales</button>
    <pre id="diagnosisOutput">Click en los botones para diagnosticar...</pre>
  </div>

  <div class="section">
    <h2>2. Pruebas CRUD</h2>
    <button onclick="testCreate()">➕ Crear Usuario</button>
    <button onclick="testEdit()">✏️ Editar walterio</button>
    <button onclick="testDelete()">🗑️ Eliminar walterio</button>
    <button onclick="testAll()">🔬 Ejecutar Todas las Pruebas</button>
    <pre id="crudOutput">Prueba de operaciones CRUD...</pre>
  </div>

  <div class="section">
    <h2>3. Debugging</h2>
    <button onclick="debugConsole()">🐛 Ver Console Logs</button>
    <button onclick="debugStorage()">💾 Ver localStorage</button>
    <button onclick="debugMockAPI()">📦 Ver mockAPI</button>
    <pre id="debugOutput">Debugging output...</pre>
  </div>

  <script src="mockAPI.js"></script>
  <script>
    // Función para escribir en el output
    function output(elId, text, type = '') {
      const el = document.getElementById(elId);
      if (type === 'success') el.style.color = '#10b981';
      else if (type === 'error') el.style.color = '#ef4444';
      else if (type === 'warning') el.style.color = '#f59e0b';
      else if (type === 'info') el.style.color = '#06b6d4';
      else el.style.color = '#f9fafb';
      el.textContent = text;
    }

    // 1. Verificar Sistema
    async function checkSystem() {
      const lines = [];
      
      // Verificar mockAPI
      if (typeof mockAPI === 'undefined') {
        output('diagnosisOutput', '❌ ERROR: mockAPI no está definido!', 'error');
        return;
      }
      lines.push('✅ mockAPI está definido');
      
      // Verificar funciones
      lines.push('Funciones disponibles:');
      lines.push('  - getUsers: ' + (typeof mockAPI.getUsers === 'function' ? '✅' : '❌'));
      lines.push('  - createUser: ' + (typeof mockAPI.createUser === 'function' ? '✅' : '❌'));
      lines.push('  - updateUser: ' + (typeof mockAPI.updateUser === 'function' ? '✅' : '❌'));
      lines.push('  - deleteUser: ' + (typeof mockAPI.deleteUser === 'function' ? '✅' : '❌'));
      
      // Verificar localStorage
      const stored = localStorage.getItem('soc_users');
      if (stored) {
        try {
          const users = JSON.parse(stored);
          lines.push(`✅ localStorage tiene ${users.length} usuario(s)`);
          lines.push('Usuarios almacenados:');
          users.forEach(u => {
            lines.push(`  - ID: ${u.id}, Usuario: ${u.username}, Email: ${u.email}`);
          });
        } catch (e) {
          lines.push('❌ Error al parsear localStorage: ' + e.message);
        }
      } else {
        lines.push('⚠️ localStorage vacío');
      }
      
      lines.push('');
      lines.push('Estado del sistema: ' + (mockAPI ? '✅ FUNCIONAL' : '❌ NO FUNCIONAL'));
      
      output('diagnosisOutput', lines.join('\n'), 'info');
      console.log('Diagnóstico del sistema:', lines.join('\n'));
    }

    // Limpiar localStorage
    function clearUsers() {
      localStorage.removeItem('soc_users');
      output('diagnosisOutput', '✅ localStorage eliminado', 'success');
      console.log('localStorage eliminado');
    }

    // Cargar datos iniciales
    async function loadInitialData() {
      try {
        // Verificar si ya hay datos
        const stored = localStorage.getItem('soc_users');
        if (stored) {
          const users = JSON.parse(stored);
          if (users.length > 0) {
            output('diagnosisOutput', `⚠️ Ya hay ${users.length} usuario(s) en localStorage`, 'warning');
            return;
          }
        }
        
        // Crear datos iniciales
        const initialUsers = [
          {
            id: 1,
            username: 'admin',
            full_name: 'Administrador del Sistema',
            email: 'admin@empresa.com',
            role: 'admin',
            is_active: true,
            created_at: new Date().toISOString().split('T')[0]
          },
          {
            id: 2,
            username: 'walterio',
            full_name: 'Walter Rios',
            email: 'walter@empresa.com',
            role: 'admin',
            is_active: true,
            created_at: new Date().toISOString().split('T')[0]
          }
        ];
        
        localStorage.setItem('soc_users', JSON.stringify(initialUsers));
        
        output('diagnosisOutput', '✅ Datos iniciales cargados', 'success');
        output('diagnosisOutput', `Creados ${initialUsers.length} usuarios:`, 'success');
        initialUsers.forEach(u => {
          output('diagnosisOutput', `  - ID: ${u.id}, Usuario: ${u.username}`, 'success');
        });
        
        console.log('Datos iniciales cargados:', initialUsers);
      } catch (error) {
        output('diagnosisOutput', '❌ Error al cargar datos: ' + error.message, 'error');
        console.error('Error al cargar datos:', error);
      }
    }

    // Test Create
    async function testCreate() {
      const lines = [];
      lines.push('🧪 PRUEBA: Crear Usuario');
      lines.push('');
      
      try {
        const result = await mockAPI.createUser({
          username: 'testuser_' + Date.now(),
          full_name: 'Usuario de Prueba ' + Date.now(),
          email: 'test' + Date.now() + '@empresa.com',
          password: 'test123',
          role: 'admin',
          is_active: true
        });
        
        if (result.success) {
          lines.push('✅ Crear: Éxito');
          lines.push('  Usuario: ' + result.user.username);
          lines.push('  ID: ' + result.user.id);
          
          // Verificar que se guardó
          const users = await mockAPI.getUsers();
          const newCount = users.length;
          lines.push('  Total usuarios: ' + newCount);
        } else {
          lines.push('❌ Crear: Error - ' + result.message);
        }
      } catch (error) {
        lines.push('❌ Crear: Excepción - ' + error.message);
        console.error('Error en testCreate:', error);
      }
      
      lines.push('');
      output('crudOutput', lines.join('\n'), 'info');
    }

    // Test Edit walterio
    async function testEdit() {
      const lines = [];
      lines.push('✏️ PRUEBA: Editar walterio');
      lines.push('');
      
      try {
        // Obtener walterio
        const users = await mockAPI.getUsers();
        const walterio = users.find(u => u.username === 'walterio');
        
        if (!walterio) {
          lines.push('❌ walterio no encontrado');
          lines.push('  Usuarios disponibles: ' + users.map(u => u.username).join(', '));
          output('crudOutput', lines.join('\n'), 'error');
          return;
        }
        
        lines.push('✅ walterio encontrado');
        lines.push('  ID: ' + walterio.id);
        lines.push('  Email actual: ' + walterio.email);
        lines.push('');
        
        // Modificar
        const originalEmail = walterio.email;
        walterio.email = 'walter.editado@empresa.com';
        walterio.full_name = 'Walter Rios Editado ' + Date.now();
        
        lines.push('✏️ Modificando...');
        lines.push('  Email nuevo: ' + walterio.email);
        lines.push('  Nombre nuevo: ' + walterio.full_name);
        lines.push('');
        
        // Guardar
        const result = await mockAPI.updateUser(walterio.id, walterio);
        
        if (result.success) {
          lines.push('✅ Actualizar: Éxito');
          
          // Verificar que se guardó correctamente
          const updatedUser = await mockAPI.getUserById(walterio.id);
          if (updatedUser) {
            lines.push('  Verificación: ' + updatedUser.email);
          }
        } else {
          lines.push('❌ Actualizar: Error - ' + result.message);
        }
        
      } catch (error) {
        lines.push('❌ Actualizar: Excepción - ' + error.message);
        console.error('Error en testEdit:', error);
      }
      
      lines.push('');
      output('crudOutput', lines.join('\n'), 'info');
    }

    // Test Delete walterio
    async function testDelete() {
      const lines = [];
      lines.push('🗑️ PRUEBA: Eliminar walterio');
      lines.push('');
      
      try {
        // Obtener walterio
        const users = await mockAPI.getUsers();
        const walterio = users.find(u => u.username === 'walterio');
        
        if (!walterio) {
          lines.push('✅ walterio ya no existe (ya fue eliminado)');
          output('crudOutput', lines.join('\n'), 'success');
          return;
        }
        
        lines.push('✅ walterio encontrado');
        lines.push('  ID: ' + walterio.id);
        lines.push('  Usuario: ' + walterio.username);
        lines.push('');
        
        // Verificar que NO es admin (ID=1)
        if (walterio.id === 1) {
          lines.push('❌ NO SE PUEDE ELIMINAR: ID=1 (admin principal)');
          output('crudOutput', lines.join('\n'), 'error');
          return;
        }
        
        lines.push('ID ≠ 1, se puede eliminar');
        lines.push('');
        
        // Eliminar
        const result = await mockAPI.deleteUser(walterio.id);
        
        if (result.success) {
          lines.push('✅ Eliminar: Éxito');
          
          // Verificar que ya no existe
          const remaining = await mockAPI.getUserById(walterio.id);
          if (!remaining) {
            lines.push('  Verificación: walterio no existe más');
          }
        } else {
          lines.push('❌ Eliminar: Error - ' + result.message);
        }
        
      } catch (error) {
        lines.push('❌ Eliminar: Excepción - ' + error.message);
        console.error('Error en testDelete:', error);
      }
      
      lines.push('');
      output('crudOutput', lines.join('\n'), 'info');
    }

    // Ejecutar todas las pruebas
    async function testAll() {
      const lines = [];
      lines.push('🔬 EJECUTANDO TODAS LAS PRUEBAS');
      lines.push('');
      
      // 1. Limpiar
      lines.push('1. Limpiando localStorage...');
      clearUsers();
      await new Promise(r => setTimeout(r, 500));
      
      // 2. Cargar datos iniciales
      lines.push('2. Cargando datos iniciales...');
      await loadInitialData();
      await new Promise(r => setTimeout(r, 500));
      
      // 3. Crear usuario
      lines.push('3. Creando usuario de prueba...');
      await testCreate();
      await new Promise(r => setTimeout(r, 500));
      
      // 4. Editar walterio
      lines.push('4. Editando walterio...');
      await testEdit();
      await new Promise(r => setTimeout(r, 500));
      
      // 5. Eliminar walterio
      lines.push('5. Eliminando walterio...');
      await testDelete();
      
      lines.push('');
      lines.push('========================================');
      lines.push('✅ PRUEBAS COMPLETADAS');
      lines.push('========================================');
      
      output('crudOutput', lines.join('\n'), 'success');
    }

    // Debug Console
    function debugConsole() {
      const lines = [];
      lines.push('🐛 DEBUG: Console');
      lines.push('');
      lines.push('window.mockAPI: ' + (typeof window.mockAPI));
      lines.push('mockAPI.getUsers: ' + (typeof mockAPI.getUsers));
      lines.push('mockAPI.createUser: ' + (typeof mockAPI.createUser));
      lines.push('mockAPI.updateUser: ' + (typeof mockAPI.updateUser));
      lines.push('mockAPI.deleteUser: ' + (typeof mockAPI.deleteUser));
      lines.push('');
      lines.push('localStorage.getItem("soc_users"): ' + localStorage.getItem('soc_users'));
      output('debugOutput', lines.join('\n'), 'info');
      console.log(lines.join('\n'));
    }

    // Debug Storage
    function debugStorage() {
      const lines = [];
      lines.push('💾 DEBUG: localStorage');
      lines.push('');
      
      const stored = localStorage.getItem('soc_users');
      if (!stored) {
        lines.push('localStorage.soc_users: (vacío)');
      } else {
        try {
          const users = JSON.parse(stored);
          lines.push('localStorage.soc_users: ' + stored);
          lines.push('');
          lines.push('Usuarios:');
          users.forEach(u => {
            lines.push('  ' + JSON.stringify(u));
          });
        } catch (e) {
          lines.push('Error al parsear: ' + e.message);
        }
      }
      
      output('debugOutput', lines.join('\n'), 'info');
      console.log(lines.join('\n'));
    }

    // Debug mockAPI
    function debugMockAPI() {
      const lines = [];
      lines.push('📦 DEBUG: mockAPI');
      lines.push('');
      
      // Mostrar todas las propiedades y métodos
      const props = Object.getOwnPropertyNames(Object.getPrototypeOf(mockAPI));
      lines.push('Métodos disponibles:');
      props.forEach(m => {
        if (typeof mockAPI[m] === 'function') {
          lines.push('  - ' + m + '()');
        }
      });
      lines.push('');
      
      // Mostrar el objeto mockAPI completo
      lines.push('Objeto mockAPI completo:');
      lines.push(JSON.stringify(mockAPI, null, 2));
      
      output('debugOutput', lines.join('\n'), 'info');
      console.log(lines.join('\n'));
    }

    // Iniciar
    window.onload = function() {
      output('diagnosisOutput', '🔧 Diagnóstico listo.\nClick en los botones para probar.', 'warning');
      console.log('Diagnóstico listo');
    };
  </script>
</body>
</html>
